# Runs the full quality gate on disposable Xode workers (see docs/deployment.md).
name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: xode-linux-x64
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Prepare the fresh worker
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y build-essential python3 xz-utils unzip
          sudo mkdir -p "$RUNNER_TOOL_CACHE"
          sudo chown "$(id -u):$(id -g)" "$RUNNER_TOOL_CACHE"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm check
      - run: pnpm test:runtimes
      - run: pnpm example:e2e
